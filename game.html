<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="gamestyle.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <title>Document</title>
  </head>
  <body class="body">
    <div class="containernumber">
      <h1 id="number">points: 0</h1>
      <h1 id="pointsPerSecond">points per second: 0</h1>
    </div>
    <hr class="separation" />
    <div class="bgbutton">
      <button id="button">
        <h1 id="power">+1</h1>
      </button>
    </div>
    <div class="upgrades">
      <button id="upgrade1">1+ click power, cost: 25</button>
      <button id="upgrade2">double click power, cost: 300</button>
      <button id="upgrade3">
        +25% points per seconf based on click power, cost: 5000
      </button>
      <button id="upgrade4">???, unlock by maxing upgrade 1</button>
    </div>
    <div class="version">
      <h3 class="text">V0.01, pre-alpha version</h3>
    </div>
    <script src="gameinputs.js"></script>
  </body>
</html>
